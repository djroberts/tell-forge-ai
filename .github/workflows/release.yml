# Releases are driven by a manually curated, dated version section in CHANGELOG.md.
# The workflow builds and publishes that version, but never commits to main.
name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the manually selected changelog version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          headings = [line for line in text.splitlines() if line.startswith("## [") and line != "## [Unreleased]"]
          if not headings:
              print("::error::CHANGELOG.md has no dated version section to release.")
              sys.exit(1)

          heading = headings[0]
          match = re.fullmatch(r"## \[(\d+\.\d+\.\d+)\] - (\d{4}-\d{2}-\d{2})", heading)
          if not match:
              print(f"::error::Invalid latest release heading: {heading!r}. Expected '## [X.Y.Z] - YYYY-MM-DD'.")
              sys.exit(1)
          version, _date = match.groups()
          version_tuple = tuple(map(int, version.split(".")))

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*"], text=True
          ).splitlines()
          parsed_tags = []
          for tag in tags:
              tag_match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
              if tag_match:
                  parsed_tags.append((tuple(map(int, tag_match.group(1).split("."))), tag))

          matching_tag = f"v{version}"
          if any(tag == matching_tag for _tag_version, tag in parsed_tags):
              print(f"Version {matching_tag} is already tagged; nothing to publish.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("release=false\n")
              sys.exit(0)

          if parsed_tags:
              latest_version, latest_tag = max(parsed_tags)
              if version_tuple <= latest_version:
                  print(f"::error::Changelog version {version} must be greater than latest tag {latest_tag}.")
                  sys.exit(1)

          # Use exactly the text under the selected version heading as release notes.
          lines = text.splitlines()
          heading_index = lines.index(heading)
          body = []
          for line in lines[heading_index + 1:]:
              if line.startswith("## "):
                  break
              body.append(line)
          Path("build").mkdir(exist_ok=True)
          Path("build/release_body.md").write_text("\n".join(body).strip() + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write("release=true\n")
          print(f"Validated release version {version} from CHANGELOG.md.")
          PY

      - name: Set up Java 21
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with caching
        if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        if: steps.version.outputs.release == 'true'
        run: ./gradlew test --stacktrace

      - name: Build plugin using changelog version
        if: steps.version.outputs.release == 'true'
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.version }} --stacktrace

      - name: Upload plugin to GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TellForgeAI v${{ steps.version.outputs.version }}
          body_path: build/release_body.md
          files: build/distributions/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
